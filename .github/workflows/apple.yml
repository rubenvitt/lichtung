name: apple

on:
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"

jobs:
  # Der Kern (LichtungKit) ist reines Foundation und muss auch unter Linux bauen.
  kit-linux:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: apple/LichtungKit
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  kit-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple/LichtungKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  # Die SwiftUI-Apps lassen sich nur auf macOS bauen. Ohne Signatur, nur
  # um zu prüfen, dass sie kompilieren.
  apps-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: macOS-App bauen
        run: >
          xcodebuild build -project Lichtung.xcodeproj -scheme Lichtung-macOS
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO
      - name: iOS-App bauen
        run: >
          xcodebuild build -project Lichtung.xcodeproj -scheme Lichtung-iOS
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
