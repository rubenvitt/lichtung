name: Lichtung

# Xcode-Projekt entsteht mit `xcodegen generate` (im Ordner apple/) und wird
# nicht eingecheckt. Aufbau wie Rudel: Logik im Package LichtungKit,
# die App-Targets enthalten nur SwiftUI und Plattform-Anbindung.
options:
  bundleIdPrefix: dev.rubeen
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  LichtungKit:
    path: LichtungKit
  # Auto-Update der Mac-App aus den GitHub Releases (scripts/release-macos.sh)
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    # Build-Nummer: scripts/testflight.sh überschreibt sie per CURRENT_PROJECT_VERSION=…
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: H95J852PKP

targets:
  Lichtung-iOS:
    type: application
    platform: iOS
    # Ordner-Globs: neue Dateien landen automatisch im Target.
    sources:
      - path: App/Shared
      - path: App/iOS
    dependencies:
      - package: LichtungKit
        product: LichtungKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lichtung
        PRODUCT_NAME: Lichtung
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lichtung
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    info:
      path: DerivedInfo/Lichtung-iOS-Info.plist
      properties:
        # Ohne diese Zuordnung schreibt xcodegen feste Werte, und die Build-Nummer bliebe 1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Nur Standard-Verschlüsselung (HTTPS); sonst hängt jeder Build in TestFlight bei „Missing Compliance“.
        ITSAppUsesNonExemptEncryption: false
        # iPad-Multitasking verlangt alle vier Ausrichtungen, sonst lehnt App Store Connect ab.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          # OAuth-Rückruf der Geräte-Anmeldung (docs/api/sync-api.md §2)
          - CFBundleURLName: dev.rubeen.lichtung.oauth
            CFBundleURLSchemes: [dev.rubeen.lichtung]
        UIBackgroundModes: [remote-notification]
        # „Beitreten“ fragt, ob Zoom/Teams installiert sind (LIC-42, JoinButton)
        LSApplicationQueriesSchemes: [zoommtg, msteams]

  Lichtung-macOS:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
    dependencies:
      - package: LichtungKit
        product: LichtungKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rubeen.lichtung.mac
        PRODUCT_NAME: Lichtung
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lichtung
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: DerivedInfo/Lichtung-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sparkle in der Sandbox: Installer-Dienst über XPC (Sparkle-Doku „Sandboxing“)
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - dev.rubeen.lichtung.mac-spks
          - dev.rubeen.lichtung.mac-spki
    info:
      path: DerivedInfo/Lichtung-macOS-Info.plist
      properties:
        # Release-Builds setzen beides (scripts/release-macos.sh), sonst stünde hier fest 0.1 und 1.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Sparkle: Feed zeigt immer auf das neueste GitHub Release.
        SUFeedURL: https://github.com/rubenvitt/lichtung/releases/latest/download/appcast.xml
        # Öffentlicher EdDSA-Schlüssel; der private liegt im Secret SPARKLE_PRIVATE_KEY.
        SUPublicEDKey: H6aM0dushMlo74vGrErL0kuDwaumFKnR/YoDi3R3ay0=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.rubeen.lichtung.oauth
            CFBundleURLSchemes: [dev.rubeen.lichtung]

schemes:
  Lichtung-iOS:
    build:
      targets:
        Lichtung-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
  Lichtung-macOS:
    build:
      targets:
        Lichtung-macOS: all
    run:
      config: Debug
